<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NASA | Earth Observation - Station ANT-42</title>
    <script src="https://cdn.jsdelivr.net/npm/profanity-cleaner@0.0.3/dist/profanity-cleaner.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #0b0f19; font-family: 'Segoe UI', sans-serif; }
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; color: #38bdf8; padding: 10px 15px; border-bottom: 2px solid #38bdf8; display: flex; gap: 8px; align-items: center; font-size: 12px; flex-shrink: 0; }
        input, .btn { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 6px 10px; border-radius: 4px; outline: none; }
        .btn { border-color: #38bdf8; color: #38bdf8; cursor: pointer; text-transform: uppercase; font-weight: bold; font-size: 10px; }
        .btn:hover { background: #38bdf8; color: #0b0f19; }
        .btn.danger { border-color: #ef4444; color: #ef4444; }
        .btn.exploit { 
            border-color: #a855f7; 
            color: #a855f7; 
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4); 
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 5px rgba(168, 85, 247, 0.4); }
            50% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.8); }
            100% { box-shadow: 0 0 5px rgba(168, 85, 247, 0.4); }
        }
        .main-grid { display: flex; flex-grow: 1; min-height: 0; overflow: hidden; }
        .view-panel { flex: 2; background: #000; position: relative; border-right: 1px solid #334155; }
        .log-panel { flex: 1; display: flex; flex-direction: column; background: #111827; }
        #log { flex-grow: 1; overflow-y: auto; padding: 15px; font-family: 'Consolas', monospace; font-size: 11px; color: #22c55e; line-height: 1.4; }
        footer { background: #1e293b; padding: 12px 15px; border-top: 2px solid #334155; display: flex; gap: 10px; flex-shrink: 0; align-items: center; }
        #chatInput { flex-grow: 1; border-color: #38bdf8; }
        #feed { width: 100%; height: 100%; border: none; position: absolute; }
        .click-shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; cursor: crosshair; }
        .status-overlay { position: absolute; top: 10px; right: 10px; color: #38bdf8; font-size: 10px; z-index: 101; pointer-events: none; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 4px; }
        #panic { display: none; position: fixed; top:0; left:0; width:100%; height:100%; z-index: 9999; }
    </style>
</head>
<body>
    <div id="panic"><iframe src="https://en.wikipedia.org" style="width:100%; height:100%; border:none;"></iframe></div>
    <div class="app-container">
        <header>
            <div style="font-weight: bold; cursor: pointer;" onclick="document.getElementById('panic').style.display='block'">🛰️ NOAA GCOS</div>
            <input id="h" placeholder="Host" value="mc.sealcentral.co" style="width: 130px;">
            <input id="u" placeholder="ID" value="JmoAI_v5" style="width: 110px;">
                <!-- auth/password/version UI removed — client will connect on 1.12.2 by default -->
                <label style="font-size:11px;color:#38bdf8"><input id="tryAll" type="checkbox" style="display:none;"> Try all versions</label>
                <input id="ver" type="hidden" value="1.12.2">
            <button class="btn" onclick="connect()">Connect</button>
            <button class="btn" onclick="recalibrate()">Recalibrate</button>
            <button class="btn danger" onclick="socket.emit('leave')">Leave</button>
        </header>
        <div class="main-grid">
            <div class="view-panel" id="mouseArea">
                <iframe id="feed"></iframe>
                <div class="click-shield"></div>
                <div class="status-overlay" id="telemetry">X: 0 | Y: 0 | Z: 0<br>SNEAK: OFF | SPRINT: OFF<br>LAST ITEM: diamond_block x64</div>
            </div>
            <div class="log-panel">
                <div id="log">-- SYSTEM INITIALIZED --</div>
            </div>
        </div>
        <footer>
            <button class="btn" onclick="document.getElementById('mouseArea').requestPointerLock()">Lock Sensors</button>
            <input id="chatInput" placeholder="Enter transmission..." onkeydown="if(event.key==='Enter') transmit()">
            <button class="btn" style="border-color: #ef4444;" onclick="socket.emit('click', 'primary')">PUNCH/DIG</button>
            <button class="btn" style="border-color: #22c55e;" onclick="socket.emit('click', 'secondary')">USE/PLACE</button>
            <button class="btn exploit" onclick="socket.emit('drop_grab_item')">DROP/GRAB ITEM</button>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
const socket = io({ transports: ['polling'] });
const keys = { 'w':'forward','s':'back','a':'left','d':'right',' ':'jump' };
let yaw = 0, pitch = 0, sprint = false, sneak = false;
const arrowState = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false };
let lastItem = { name: 'diamond_block', amount: 64 };

// --- SCRUBBER CONFIGURATION ---
// Add any specific self-harm words or slurs here
const customBadWords = ['suicide', 'drugs', 'violence']; 

function connect() {
    const payload = {
        h: document.getElementById('h').value,
        u: document.getElementById('u').value,
        version: document.getElementById('ver').value,
        tryAll: document.getElementById('tryAll').checked
    };
    socket.emit('start', payload);

    const computeCameraUrl = () => {
        const origin = window.location.origin;
        if (origin.includes('-8080.')) return origin.replace('-8080.', '-3001.');
        if (origin.includes(':8080')) return origin.replace(':8080', ':3001');
        return `${location.protocol}//${location.hostname}:3001`;
    };

    const cameraUrl = computeCameraUrl();
    setTimeout(() => { document.getElementById('feed').src = cameraUrl; }, 2000);
}

socket.on('connect', () => {
    const l = document.getElementById('log');
    l.innerHTML += `<div>[SYSTEM] Socket connected (${socket.id})</div>`;
    l.scrollTop = l.scrollHeight;
});

socket.on('disconnect', (reason) => {
    const l = document.getElementById('log');
    l.innerHTML += `<div>[SYSTEM] Socket disconnected: ${reason}</div>`;
    l.scrollTop = l.scrollHeight;
});

function recalibrate() {
    socket.emit('recalibrate');
    const f = document.getElementById('feed');
    const s = f.src; f.src = ''; setTimeout(() => f.src = s, 200);
}

function transmit() {
    const i = document.getElementById('chatInput');
    if(i.value) { socket.emit('msg', i.value); i.value = ''; i.blur(); }
}

// --- MAIN LOG LISTENER WITH SCRUBBER ---
socket.on('log', m => {
    const l = document.getElementById('log');
    
    // 1. Initial terminology replacements
    let cleanMessage = m.replace(/game/gi, 'Network').replace(/player/gi, 'Unit');

    // 2. Comprehensive Scrub (Slurs, Curse words, Self-harm)
    cleanMessage = profanityCleaner.clean(cleanMessage, { 
        customBadWords: customBadWords,
        placeholder: '*' 
    });

    // 3. UI Display (Using textContent for safety)
    const div = document.createElement('div');
    div.textContent = `[DATA] ${cleanMessage}`;
    l.appendChild(div);
    l.scrollTop = l.scrollHeight;

    // 4. Update last grabbed item display
    if(m.startsWith('⭐ DROPPED') || m.includes('ran; grabitem')) {
        const match = m.match(/(\d+)x (\w+)/);
        if(match) { 
            lastItem.amount = parseInt(match[1]); 
            lastItem.name = match[2]; 
        }
        updateTelemetryDisplay(0, 0, 0); // Temporary update for items
    }
});

// --- TELEMETRY ---
socket.on('telemetry', d => {
    updateTelemetryDisplay(d.x, d.y, d.z);
});

function updateTelemetryDisplay(x, y, z) {
    document.getElementById('telemetry').innerHTML = 
        `X: ${x} | Y: ${y} | Z: ${z}<br>` +
        `SNEAK: ${sneak ? 'ON' : 'OFF'} | SPRINT: ${sprint ? 'ON' : 'OFF'}<br>` +
        `LAST ITEM: ${lastItem.name} x${lastItem.amount}`;
}

// --- CONTROLS & MOVEMENT ---
document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.getElementById('mouseArea')) {
        yaw -= e.movementX * 0.005; pitch -= e.movementY * 0.005;
        updateView();
    }
});

setInterval(() => {
    let changed = false;
    if (arrowState.ArrowLeft) { yaw += 0.05; changed = true; }
    if (arrowState.ArrowRight) { yaw -= 0.05; changed = true; }
    if (arrowState.ArrowUp) { pitch += 0.05; changed = true; }
    if (arrowState.ArrowDown) { pitch -= 0.05; changed = true; }
    if (changed) updateView();
}, 30);

function updateView() {
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
    socket.emit('look', { yaw, pitch });
}

document.getElementById('mouseArea').addEventListener('mousedown', e => {
    if (document.pointerLockElement === document.getElementById('mouseArea')) {
        socket.emit('click', e.button === 0 ? 'primary' : 'secondary');
    }
});

window.addEventListener('keydown', e => {
    if (document.activeElement === document.getElementById('chatInput')) return;
    if (e.key === ' ' && e.target === document.body) e.preventDefault();
    if (keys[e.key]) socket.emit('move', { k: keys[e.key], s: true });
    if (arrowState.hasOwnProperty(e.key)) { e.preventDefault(); arrowState[e.key] = true; }
    if (e.key === 'Control') { sprint = !sprint; socket.emit('move', { k: 'sprint', s: sprint }); }
    if (e.key === 'Shift') { e.preventDefault(); sneak = !sneak; socket.emit('move', { k: 'sneak', s: sneak }); }
});

window.addEventListener('keyup', e => {
    if (keys[e.key]) socket.emit('move', { k: keys[e.key], s: false });
    if (arrowState.hasOwnProperty(e.key)) arrowState[e.key] = false;
});

    </script>
</body>
</html>
